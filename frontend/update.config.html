<div layout="column" ng-cloak class="module-padding">

    <!-- navigation tabs -->
    <md-nav-bar md-selected-nav-item="$ctrl.tabIndex" nav-bar-aria-label="Updates tabs">
        <md-nav-item md-nav-click="goto('modules')" name="modules">Applications updates</md-nav-item>
        <md-nav-item md-nav-click="goto('cleep')" name="cleep">Cleep updates</md-nav-item>
        <md-nav-item md-nav-click="goto('os')" name="os">OS updates</md-nav-item>
        <md-nav-item md-nav-click="goto('logs')" name="logs">Apps update logs</md-nav-item>
        <md-nav-item md-nav-click="goto('options')" name="options">Options</md-nav-item>
    </md-nav-bar>

    <div layout="column" layout-padding ng-if="$ctrl.tabIndex==='modules'">
        <config-button
            cl-title="Check available applications updates" cl-subtitle="Last check at {{ $ctrl.config.moduleslastcheck | hrDatetime }}"
            cl-btn-label="Check updates" cl-btn-icon="find-replace"
            cl-click="$ctrl.checkModulesUpdates()"
        ></config-button>

        <config-section cl-title="Installed applications" cl-icon="application-outline"></config-section>
        <config-list
            cl-items="$ctrl.moduleUpdates" cl-empty="No applications installed"
        ></config-list>
	</div>

    <div layout="column" layout-padding ng-if="$ctrl.tabIndex==='logs'">
        <config-list
            cl-items="$ctrl.moduleLogs" cl-empty="No applications installed"
        ></config-list>
    </div>

    <div layout="column" layout-padding ng-if="$ctrl.tabIndex==='cleep'">
        <config-button
            cl-title="Cleep version {{$ctrl.config.cleepversion}} is installed"
            cl-subtitle="No update available (last check {{$ctrl.cleepService.modules['update'].config.cleeplastcheck | hrDatetime}})"
            cl-disabled="$ctrl.cleepUpdates.processing || $ctrl.cleepUpdates.pending"
            cl-btn-label="Check updates" cl-btn-icon="find-replace"
            cl-click="$ctrl.checkCleepUpdates()"
        ></config-button>

        <config-button
            ng-if="$ctrl.cleepUpdates.updatable"
            cl-disabled="$ctrl.cleepUpdates.processing || $ctrl.cleepUpdates.pending"
            cl-title="New Cleep version {{$ctrl.cleepUpdates.version}} is available"
            cl-btn-label="Update Cleep" cl-btn-icon="update" cl-btn-style="md-accent md-raised"
            cl-click="$ctrl.showCleepUpdateDialog($event)"
        ></config-button>

        <config-progress
            ng-if="$ctrl.cleepUpdates.processing && $ctrl.updateService.cleepUpdateStatus < 2"
            cl-title="{{ $ctrl.cleepInstallProgress }}"
            cl-model="$ctrl.updateService.cleepUpdateProgress"
            cl-style="md-accent"
        ></config-progress>
        <config-progress
            ng-if="$ctrl.cleepUpdates.processing && $ctrl.updateService.cleepUpdateStatus === 2"
            cl-title="{{ $ctrl.cleepInstallProgress }}" cl-model="100"
        ></config-progress>
        <config-note
            ng-if="$ctrl.cleepUpdates.failed && $ctrl.updateService.cleepUpdateStatus > 2"
            cl-type="warning"
            cl-note="{{ $ctrl.cleepInstallProgress }}"
            cl-icon="alert"
        ></config-note>

        <config-button
            ng-if="$ctrl.config.cleepupdatelogs.timestamp"
            cl-title="Last update installation {{ $ctrl.config.cleepupdatelogs.failed ? 'failed' : 'succeed' }} at {{ $ctrl.config.cleepupdatelogs.timestamp | hrDatetime }}"
            cl-click="$ctrl.showLogsDialog('cleep', $event)"
            cl-btn-label="Show logs" cl-btn-icon="file-document-outline" cl-btn-style="{{ $ctrl.config.cleepupdatelogs.failed ? 'md-raised md-accent': 'md-raised md-primary' }}"
        ></config-button>
	</div>

    <div layout="column" layout-padding ng-if="$ctrl.tabIndex==='os'">
        <config-button
            cl-title="CleepOs {{ $ctrl.osInfo.version || 'unknown' }} ({{ $ctrl.osInfo.suite || '—' }})"
            cl-subtitle="{{ $ctrl.osCheckSubtitle }}"
            cl-btn-label="Check updates" cl-btn-icon="find-replace"
            cl-click="$ctrl.checkOsUpdates()"
        ></config-button>

        <config-note
            ng-if="$ctrl.osUpdates.updatable"
            cl-type="info"
            cl-icon="information"
            cl-note="OS update {{ $ctrl.osUpdates.version }} is available."
        ></config-note>

        <config-button
            ng-if="$ctrl.osUpdates.updatable && !$ctrl.osUpdates.processing && !$ctrl.osUpdates.pending"
            cl-title="Apply OS update to {{ $ctrl.osUpdates.version }}"
            cl-subtitle="Device will reboot when the update completes"
            cl-btn-label="Update OS" cl-btn-icon="update" cl-btn-style="md-accent md-raised"
            cl-click="$ctrl.updateOs()"
        ></config-button>

        <config-progress
            ng-if="$ctrl.osUpdates.processing"
            cl-title="{{ $ctrl.osInstallProgress }}"
            cl-model="$ctrl.updateService.osUpdateProgress"
            cl-style="md-accent"
        ></config-progress>

        <config-note
            ng-if="$ctrl.osUpdates.failed"
            cl-type="warning"
            cl-icon="alert"
            cl-note="Last OS update failed. Check device logs for details."
        ></config-note>

        <config-note
            ng-if="$ctrl.osUpdates.pending"
            cl-type="info"
            cl-icon="information"
            cl-note="OS update applied. Device is rebooting..."
        ></config-note>

        <config-note
            ng-if="$ctrl.osUpdates.cleep_too_old"
            cl-type="warning"
            cl-icon="alert"
            cl-note="OS update {{ $ctrl.osUpdates.version }} requires Cleep {{ $ctrl.osUpdates.min_cleep_version }} or newer. Update Cleep first."
        ></config-note>

        <config-section
            ng-if="$ctrl.config.osconfreportenabled"
            cl-title="OS conf leftover report"
            cl-icon="file-document-outline"
        ></config-section>
        <config-note
            ng-if="$ctrl.config.osconfreportenabled"
            cl-type="info"
            cl-icon="shield-check"
            cl-note="Only file paths and apt action lines are collected — never configuration file contents (wifi passwords, keys, etc.). This highlights files to review for a future migration script."
        ></config-note>
        <config-button
            ng-if="$ctrl.config.osconfreportenabled"
            cl-title="{{ $ctrl.osConfReportTitle }}"
            cl-subtitle="{{ $ctrl.osConfReportSubtitle }}"
            cl-btn-label="Show report" cl-btn-icon="file-document-outline"
            cl-click="$ctrl.showOsConfReportDialog($event)"
        ></config-button>
        <config-button
            ng-if="$ctrl.config.osconfreportenabled"
            cl-title="Refresh report from this device"
            cl-subtitle="Rescan leftover .dpkg-* / .ucf-* paths without running an OS update"
            cl-btn-label="Refresh" cl-btn-icon="refresh"
            cl-click="$ctrl.refreshOsConfReport()"
        ></config-button>
        <config-button
            ng-if="$ctrl.config.osconfreportenabled && $ctrl.osConfReport && $ctrl.osConfReport.leftover_count >= 0"
            cl-title="Send last report to Sentry"
            cl-subtitle="{{ $ctrl.osConfReport.sent ? ('Last sent ' + ($ctrl.osConfReport.sent_at | hrDatetime)) : 'Not sent yet' }}"
            cl-btn-label="Send to Sentry" cl-btn-icon="cloud-upload" cl-btn-style="md-raised"
            cl-click="$ctrl.sendOsConfReport()"
        ></config-button>
	</div>

    <div layout="column" layout-padding ng-if="$ctrl.tabIndex==='options'">
        <config-note
            cl-type="info" cl-note="To enjoy new features and bug fixes automatically, enable automatic updates" cl-icon="information"
        ></config-note>
        <config-switch
            cl-title="Enable automatic Cleep application updates"
            cl-meta="{ type: 'cleep' }"
            cl-model="$ctrl.config.cleepupdateenabled" cl-click="$ctrl.setAutomaticUpdate(value, meta)"
        ></config-switch>
        <config-switch
            cl-title="Enable automatic applications updates"
            cl-meta="{ type: 'apps' }"
            cl-model="$ctrl.config.modulesupdateenabled" cl-click="$ctrl.setAutomaticUpdate(value, meta)"
        ></config-switch>

        <config-section cl-title="OS upgrade feedback" cl-icon="raspberry-pi"></config-section>
        <config-note
            cl-type="info"
            cl-icon="information"
            cl-note="After an OS playbook upgrade, Cleep can list configuration files that apt kept or replaced (.dpkg-dist, etc.). Only paths are stored or sent — never file contents."
        ></config-note>
        <config-switch
            cl-title="Enable OS conf leftover report"
            cl-meta="{ field: 'enabled' }"
            cl-model="$ctrl.config.osconfreportenabled"
            cl-click="$ctrl.setOsConfReportOptions(value, meta)"
        ></config-switch>
        <config-switch
            ng-if="$ctrl.config.osconfreportenabled"
            cl-title="Automatically send report to Sentry after OS upgrade"
            cl-meta="{ field: 'autosend' }"
            cl-model="$ctrl.config.osconfreportautosend"
            cl-click="$ctrl.setOsConfReportOptions(value, meta)"
        ></config-switch>
	</div>

</div>
