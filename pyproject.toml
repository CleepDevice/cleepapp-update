[tool.black]
line-length = 130
target-version = ["py39"]
extend-exclude = '''
/(
  \.venv
  | docs/_build
)/
'''

[tool.isort]
profile = "black"
line_length = 130
known_first_party = ["backend"]
known_third_party = ["cleep", "pytest"]
skip_glob = [".venv/**", "docs/_build/**"]

[tool.pylint.format]
max-line-length = 130

[tool.pydocstyle]
convention = "google"
